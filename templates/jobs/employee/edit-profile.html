{% extends 'base.html' %}
{% block title %}Profile{% endblock %}
{% block content %}
<section class="detail-hero"><div class="container"><div class="eyebrow">Candidate profile</div><h1 class="section-title">Keep your profile current</h1></div></section>
<section class="section"><div class="container"><div class="auth-card">
<form method="post">{% csrf_token %}{% for field in form %}<div class="form-group"><label class="form-label">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}<button class="btn btn-primary">Save changes</button></form>
</div></div></section>
{% endblock %}
